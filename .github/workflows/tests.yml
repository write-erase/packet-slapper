name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest ruff
      - name: Lint (errors and likely bugs only)
        run: ruff check --select F,E9,B plugin.py tests
      - name: plugin.json is valid
        run: python -c "import json; m = json.load(open('plugin.json')); assert m['version'] and m['fields'] and m['actions']"
      - run: pytest -q tests
